# Configuration de RedisBungee pour Velocity
# Synchronisation du chat et des données entre Java et Bedrock

# Activer ou désactiver Redis
redis:
  enabled: true
  
  # Adresse du serveur Redis
  host: "127.0.0.1"
  
  # Port du serveur Redis
  port: 6379
  
  # Mot de passe Redis (laisser vide si aucun)
  password: ""
  
  # Base de données Redis (0 par défaut)
  database: 0
  
  # Timeout de connexion (en millisecondes)
  timeout: 2000

# Options de synchronisation
sync:
  # Synchroniser les messages de chat entre les serveurs
  chat: true
  
  # Synchroniser les commandes entre les serveurs
  commands: true
  
  # Synchroniser les permissions (nécessite LuckPerms)
  permissions: true
  
  # Synchroniser les bans (nécessite AdvancedBan)
  bans: true
  
  # Synchroniser les messages de connexion/déconnexion
  join-leave-messages: true

# Options de chat global
chat:
  # Activer le chat global entre tous les serveurs
  global: true
  
  # Format du chat global
  # Utilisez %server%, %player%, %message%
  format: "§7[%server%] %prefix%%player%§7: %message%"
  
  # Préfixes pour les serveurs
  server-prefixes:
    lobby: "§6[Lobby]"
    survie: "§a[Survie]"
    creatif: "§b[Créatif]"
    minijeux: "§c[Mini-Jeux]"
  
  # Préfixes pour les types de joueurs
  player-prefixes:
    java: "§7[JAVA]"
    bedrock: "§7[BE]"
  
  # Activer les couleurs dans le chat
  allow-colors: true

# Options de logging
logging:
  # Activer les logs des connexions Redis
  log-connections: true
  
  # Activer les logs des erreurs Redis
  log-errors: true
  
  # Activer les logs du chat
  log-chat: true
